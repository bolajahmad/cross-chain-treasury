type Transfer @entity {
  id: ID!
  network: String! @index
  block: Int! @index
  timestamp: DateTime! @index
  from: String! @index
  to: String! @index
  value: BigInt!
  txHash: String! @index
}

type Action @entity {
  id: ID!
  network: String! @index
  block: Int! @index
  timestamp: DateTime! @index
  actionId: String! @index
  actionType: Int!
  params: String!
  value: BigInt!
  status: String!
  txHash: String! @index
}